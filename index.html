<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09070f">
<meta name="description" content="A birthday surprise for Keeno.">
<title>Happy Birthday Keeno ❤️</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#241333 0,#100b19 48%,#07060b 100%);color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.lock{width:min(100%,520px);text-align:center;padding:32px 22px;border:1px solid #ffffff20;border-radius:28px;background:#ffffff08;box-shadow:0 20px 80px #0008}.heart{font-size:48px;filter:drop-shadow(0 0 20px #c45cff)}h1{font-family:Georgia,serif;font-size:clamp(30px,7vw,44px);margin:14px 0;color:#f2d8ff}p{color:#d3c4df;line-height:1.65}.count{font-size:clamp(28px,8vw,42px);font-variant-numeric:tabular-nums;letter-spacing:2px;margin:22px 0;color:#fff}.hint{font-size:13px;color:#a99ab7}button{border:0;border-radius:999px;padding:13px 20px;background:linear-gradient(135deg,#d6a5ff,#8f54c6);color:#160c20;font-weight:700;font-size:15px;cursor:pointer;margin:8px}button:disabled{opacity:.5}.status{min-height:24px;color:#e3c8ff;font-size:14px}
</style>
</head>
<body>
<main class="lock">
<div class="heart">💜</div>
<h1>A little surprise is waiting</h1>
<p id="message">This birthday experience opens on June 2. The countdown is just for now… ✨</p>
<div class="count" id="countdown">Loading…</div>
<p class="hint">Private preview is available to the site owner.</p>
<button id="ownerLogin" hidden>Sign in with GitHub to preview</button>
<div class="status" id="status" role="status"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
 const URL='https://bhtyestavehwaymfozxw.supabase.co';
 const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodHllc3RhdmVod2F5bWZvenh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDkwODksImV4cCI6MjEwMTQyNTA4OX0.4-8U1fe5LQVTsuFa1kgc8A1PQeBQrh_UTibZsmApPrQ';
 const client=window.supabase.createClient(URL,KEY);
 const endpoint=URL+'/functions/v1/birthday-gate';
 const $=id=>document.getElementById(id);
 const nextBirthday=()=>{const now=new Date();const y=now.getFullYear();const d=new Date(y,5,2);if(now>=d)d.setFullYear(y+1);return d};
 function tick(){const now=new Date(),target=nextBirthday(),ms=Math.max(0,target-now);const days=Math.floor(ms/86400000),hours=Math.floor(ms%86400000/3600000),mins=Math.floor(ms%3600000/60000),secs=Math.floor(ms%60000/1000);$('countdown').textContent=days+'d '+String(hours).padStart(2,'0')+':'+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')}
 async function loadSite(token){$('status').textContent='Checking secure access…';try{const headers={'Content-Type':'application/json','apikey':KEY};if(token)headers.Authorization='Bearer '+token;const res=await fetch(endpoint,{method:'POST',headers,body:'{}',cache:'no-store'});if(res.ok){const html=await res.text();document.open();document.write(html);document.close();return true}if(res.status===403){$('status').textContent='Only the site owner can preview before June 2.';return false}throw new Error('Temporary access check failed ('+res.status+').')}catch(e){$('status').textContent=e.message||'Could not connect. Please try again.';return false}}
 $('ownerLogin').addEventListener('click',async()=>{ $('ownerLogin').disabled=true;$('status').textContent='Opening GitHub sign-in…';const {error}=await client.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.origin+location.pathname}});if(error){$('status').textContent='GitHub sign-in failed: '+error.message;$('ownerLogin').disabled=false}});
 (async()=>{tick();setInterval(tick,1000);const {data:{session}}=await client.auth.getSession();if(session){await loadSite(session.access_token);return}const loaded=await loadSite();if(!loaded){$('ownerLogin').hidden=false}})();
})();
</script>
</body>
</html>
